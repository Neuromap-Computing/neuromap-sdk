site_name: Neuromap SDK
site_description: SDK for programming Neuromap neuromorphic chips
repo_url: https://github.com/neuromap/neuromap

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
  features:
    - content.code.copy
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Board Guide: board.md
  - Protocol Reference: protocol.md
  - API Reference:
      - chip: api/chip.md
      - network: api/network.md
      - trainer: api/trainer.md
      - export: api/export.md
      - board: api/board.md
      - monitor: api/monitor.md
  - CLI Reference: cli.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

docs_dir: docs
