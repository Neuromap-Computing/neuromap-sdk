site_name: Neuromap Docs
site_description: Documentation for the Neuromap SDK, Studio, and data ingestion
site_url: https://docs.neuromap.ca/
repo_url: https://github.com/laurent-colas/neuromap

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  font:
    text: Space Grotesk
  palette:
    scheme: default
    primary: indigo
    accent: teal
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - SDK:
      - Home: index.md
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - API Reference:
          - convenience: api/convenience.md
          - chip: api/chip.md
          - network: api/network.md
          - trainer: api/trainer.md
          - export: api/export.md
  - Studio:
      - Overview: studio/index.md
  - Ingestion:
      - Overview: ingestion/index.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

docs_dir: docs
