[tool.poetry]
name = "neuromap"
version = "0.1.4"
description = "SDK for programming Neuromap neuromorphic chips"
readme = "README.md"
license = "MIT"
authors = ["Neuromap <contact@neuromap.ca>"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "neuromap", from = "src" }]

[tool.poetry.urls]
Homepage = "https://neuromap.ca"
Repository = "https://github.com/Neuromap-Computing/neuromap-sdk"
"Bug Tracker" = "https://github.com/Neuromap-Computing/neuromap-sdk/issues"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# On Linux (where CI runs), pull the CPU-only wheel: the default PyPI build
# drags in ~14 unused nvidia-*-cu12 packages on a GPU-less runner. macOS has no
# wheels on that index, and Windows/macOS dev machines keep the default
# resolution. GPU users on Linux can reinstall the matching CUDA wheel in their
# own venv after `poetry install`. This pin does not affect `pip install
# neuromap` from PyPI, where torch resolves through pip's own default index.
torch = [
    { version = ">=2.0", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = ">=2.0", markers = "sys_platform != 'linux'" },
]
numpy = ">=1.24"
snntorch = ">=0.9"
# PEP 594 removed `audioop` from the stdlib in Python 3.13. This backport
# restores the same module so _internal/audio.py keeps its A-law / mu-law
# decoding on 3.13+ without a code change. No-op on 3.10-3.12.
audioop-lts = { version = ">=0.2.1", python = ">=3.13" }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
scipy = "*"
ruff = ">=0.6.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
