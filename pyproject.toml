[tool.poetry]
name = "neuromap"
version = "0.1.4"
description = "SDK for programming Neuromap neuromorphic chips"
readme = "README.md"
license = "MIT"
authors = ["Neuromap <contact@neuromap.ca>"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "neuromap", from = "src" }]

[tool.poetry.urls]
Homepage = "https://neuromap-two.vercel.app"
Repository = "https://github.com/laurent-colas/neuromap"
"Bug Tracker" = "https://github.com/laurent-colas/neuromap/issues"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
torch = ">=2.0"
numpy = ">=1.24"
snntorch = ">=0.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
scipy = "*"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
