[project]
name = "neuromap"
version = "0.1.4"
description = "SDK for programming Neuromap neuromorphic chips"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neuromap", email = "contact@neuromap.ca" }]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "snntorch>=0.9",
    # PEP 594 removed `audioop` from the stdlib in Python 3.13. This backport
    # restores the same module so _internal/audio.py keeps its A-law / mu-law
    # decoding on 3.13+ without a code change. No-op on 3.10-3.12.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://neuromap.ca"
Repository = "https://github.com/Neuromap-Computing/neuromap-sdk"
"Bug Tracker" = "https://github.com/Neuromap-Computing/neuromap-sdk/issues"

[dependency-groups]
dev = ["pytest>=7.0", "scipy", "ruff>=0.6.0"]

# On Linux (where CI runs), pull the CPU-only wheel: the default PyPI build
# drags in ~14 unused nvidia-*-cu12 packages on a GPU-less runner. macOS has no
# wheels on that index, so the marker leaves it on PyPI, and Windows/macOS dev
# machines keep the default resolution. GPU users on Linux can reinstall the
# matching CUDA wheel in their own venv after `uv sync`.
#
# `[tool.uv.sources]` applies to this checkout only. It is not written into the
# published metadata, so `pip install neuromap` from PyPI still resolves torch
# through pip's own default index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# `explicit = true`: nothing resolves from this index unless a source above
# names it. Without the flag every package would be looked up there first.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuromap"]

# Keep the sdist to the sources that build the wheel. The default would add
# tests/, examples/ and the whole docs site.
[tool.hatch.build.targets.sdist]
include = ["/src/neuromap", "/README.md", "/LICENSE"]
