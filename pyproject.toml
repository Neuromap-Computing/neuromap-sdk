[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuromap"
dynamic = ["version"]
description = "SDK for programming Neuromap neuromorphic chips"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Neuromap", email = "contact@neuromap.ca" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://neuromap-two.vercel.app"
Repository = "https://github.com/laurent-colas/neuromap"
"Bug Tracker" = "https://github.com/laurent-colas/neuromap/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scipy",
]

[tool.hatch.version]
path = "src/neuromap/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/neuromap"]
